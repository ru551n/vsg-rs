# Fuzzing runs on a schedule, not per pull request: it needs nightly Rust and minutes of CPU,
# and its failures are rare. The target is fuzz/fuzz_targets/format.rs.
name: Fuzz

on:
  schedule:
    # 03:17 UTC, daily.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to fuzz
        default: "300"
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ". -> target\nfuzz -> target"
      - uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2
        with:
          tool: cargo-fuzz@0.13.2
      - name: Fuzz the formatter
        env:
          SECONDS_TO_RUN: ${{ inputs.seconds || '300' }}
        # cargo-fuzz defaults to the target it was itself built for, and the prebuilt binary
        # is a musl one, whose static libc the sanitizer cannot use.
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo fuzz run --target "$host" format -- -max_total_time="$SECONDS_TO_RUN" -timeout=30
      - name: Keep what crashed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
