# cargo-deny: what vsg-rs accepts from its dependency tree (`cargo deny check`, and the `deny`
# job in CI). vsg-rs is MIT OR Apache-2.0 and ships THIRD_PARTY_LICENSES.md, so a new
# dependency with another licence has to be a deliberate decision, not a surprise.

[graph]
all-features = true

[advisories]
# RUSTSEC advisories and unmaintained crates fail the check.
yanked = "deny"

[licenses]
# Permissive licences, plus the file-level copyleft MPL-2.0 of the parser (vhdl_syntax, used
# as an unmodified dependency; see docs/vhdl-frontend.md).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[bans]
# Several versions of the same crate bloat the binary; list them here once reviewed.
multiple-versions = "deny"
wildcards = "deny"
skip = [
    # vhdl_lang's strum brings an older syn than clap's derive does. Nothing we can change
    # without patching a dependency, and both are proc-macro only, so no binary bloat.
    { crate = "syn@2", reason = "vhdl_lang -> strum_macros" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The parser is pinned to a git revision until a release carries the fixes it needs.
allow-git = ["https://github.com/VHDL-LS/rust_hdl"]
