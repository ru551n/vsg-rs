# Builds and tests the `vsg-rs` Python package (a wheel that ships the `vsg-rs` binary) for Linux,
# Windows and macOS, and publishes it on version tags. See docs/releasing.md.
#
# - push of a tag `vX.Y.Z`: build, test, publish to PyPI, create a GitHub release with the
#   wheels, the sdist and standalone binaries for Linux, Windows and macOS
# - manual run (workflow_dispatch) or a pull request touching packaging: build and test only
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "pyproject.toml"
      - "python/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check tag matches crate version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Compare versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "$TAG" != "v$crate" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $crate"
            exit 1
          fi

  linux:
    name: Wheel (${{ matrix.platform.manylinux }}, ${{ matrix.platform.target }})
    needs: version
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { target: x86_64, manylinux: "2_28" }
          - { target: aarch64, manylinux: "2_28" }
          - { target: x86_64, manylinux: musllinux_1_2 }
          - { target: aarch64, manylinux: musllinux_1_2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-linux-${{ matrix.platform.manylinux }}-${{ matrix.platform.target }}
          path: dist

  windows:
    name: Wheel (windows, ${{ matrix.target }})
    needs: version
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is cross-compiled on the x64 runner.
        target: [x64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    name: Wheel (macos, ${{ matrix.target }})
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # x86_64 is cross-compiled on the arm64 runner.
        target: [aarch64, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}-apple-darwin
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheels-sdist
          path: dist

  binaries:
    name: Binary (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static Linux binaries, cross-compiled with zig.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true, run: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true, run: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, zig: false, run: true }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, zig: false, run: false }
          - { os: macos-latest, target: aarch64-apple-darwin, zig: false, run: true }
          - { os: macos-latest, target: x86_64-apple-darwin, zig: false, run: false }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: matrix.zig
        run: pip install --retries 10 --timeout 60 ziglang cargo-zigbuild
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          name="vsg-rs-$TAG-${{ matrix.target }}"
          mkdir -p "dist/$name"
          exe=target/${{ matrix.target }}/release/vsg-rs
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          cp "$exe" README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES.md "dist/$name/"
          if [ "${{ matrix.run }}" = "true" ]; then "dist/$name/$(basename "$exe")" --version; fi
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binaries-${{ matrix.target }}
          path: dist

  test-wheels:
    name: Test wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: [linux, windows, macos]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The wheel is `py3-none-<platform>` (`bindings = "bin"`), so the same bytes are
        # installed on every version: the oldest and the newest are enough.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Install the wheel for this platform
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then bin=.venv/Scripts; else bin=.venv/bin; fi
          "$bin/python" -m pip install --upgrade pip
          # --only-binary: never fall back to building the sdist here.
          "$bin/python" -m pip install --no-index --only-binary :all: --find-links dist vsg-rs
          # GITHUB_PATH needs a native path on Windows.
          if [ "$RUNNER_OS" = "Windows" ]; then cygpath -w "$PWD/$bin"; else echo "$PWD/$bin"; fi >> "$GITHUB_PATH"
      - name: Smoke test
        shell: bash
        run: python python/tests/smoke.py

  test-sdist:
    name: Build from sdist (${{ matrix.os }})
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheels-sdist
          path: dist
      - name: Install from sdist
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then bin=.venv/Scripts; else bin=.venv/bin; fi
          "$bin/python" -m pip install dist/*.tar.gz
          # GITHUB_PATH needs a native path on Windows.
          if [ "$RUNNER_OS" = "Windows" ]; then cygpath -w "$PWD/$bin"; else echo "$PWD/$bin"; fi >> "$GITHUB_PATH"
      - name: Smoke test
        shell: bash
        run: python python/tests/smoke.py

  publish:
    name: Publish to PyPI
    needs: [test-wheels, test-sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vsg-rs/
    permissions:
      # PyPI trusted publishing and artifact attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      # Artifact attestations need a public repository (or GitHub Enterprise Cloud).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          attestations: ${{ github.event.repository.visibility == 'public' }}

  # One VSIX per platform, each carrying the server built in this same run. Nothing is fetched
  # from a previous release, so the bundled binary is provably the one this tag produced.
  vscode:
    name: VS Code extension
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binaries-*
          path: archives
          merge-multiple: true
      # The binary jobs publish archives; the packaging script wants the executables.
      - name: Unpack the servers
        shell: bash
        run: |
          mkdir -p servers
          for archive in archives/*.tar.gz; do
            [ -e "$archive" ] || continue
            tar xzf "$archive" -C servers
          done
          for archive in archives/*.zip; do
            [ -e "$archive" ] || continue
            unzip -q "$archive" -d servers
          done
          find servers -type f -name 'vsg-rs*' -print
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run compile
        working-directory: editors/vscode
      - name: Package
        working-directory: editors/vscode
        run: node scripts/package.mjs --binaries ../../servers
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # The release job collects artifacts matching `*-*`, so the name needs a hyphen or the
          # VSIX files would be built and then never attached to anything.
          name: vsix-extension
          path: editors/vscode/*.vsix

  github-release:
    name: GitHub release
    needs: [publish, binaries, vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Artifact attestations for the binary archives.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: "*-*"
          path: dist
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: dist/vsg-rs-*
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="## ${TAG#v}" '$0 == v {on=1; next} /^## / {on=0} on' src/CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
