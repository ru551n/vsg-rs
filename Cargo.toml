[package]
name = "vsg-rs"
version = "0.9.6"
edition = "2024"
rust-version = "1.95"
description = "A fast Rust-native VHDL formatter and style checker with VSG-compatible rules and configuration."
license = "MIT OR Apache-2.0"
repository = "https://github.com/ru551n/vsg-rs"
readme = "README.md"
keywords = ["vhdl", "formatter", "linter", "vsg"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "vsg_rs"

[[bin]]
name = "vsg-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
similar = "3.2.0"
tempfile = "3.27.0"
# Pinned to a git revision with fixes after the 0.2.0 release (see docs/vhdl-frontend.md).
vhdl_syntax = { git = "https://github.com/VHDL-LS/rust_hdl", rev = "419ec78", version = "0.2.0" }
yaml_serde = "0.10.7"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
# Syntax-kind tables read best with glob imports and one arm per concept.
enum_glob_use = "allow"
match_same_arms = "allow"
naive_bytecount = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
