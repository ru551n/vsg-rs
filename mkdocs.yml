# The published documentation (Read the Docs). It covers what vsg-rs adds on top of VSG; the
# VSG interface itself is documented by VSG and linked to from the home page, so that the two
# cannot drift apart.
site_name: vsg-rs
site_description: A VHDL formatter and linter in Rust, compatible with VSG.
site_url: https://vsg-rs.readthedocs.io/
repo_url: https://github.com/ru551n/vsg-rs
repo_name: ru551n/vsg-rs
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences

# Working notes that restate VSG's own reference. They stay in the repository for development
# but are not published: VSG documents its rules and its configuration.
nav:
  - Home: index.md
  - Getting started:
      - Quick start: quick-start.md
      - Coming from VSG: migrating-from-vsg.md
  - Formatter:
      - Formatting: formatting.md
      - Line folding: line-folding.md
      - Folding coverage: line-folding-coverage.md
      - Format on save: editors.md
      - Language server: lsp.md
      - MCP server: mcp.md
      - Claude Code plugin: claude-code.md
  - Static analysis:
      - Overview: lint.md
      - Project setup: project-setup.md
      - Rule reference: rule-reference.md
      - Native rules in detail: native-rules.md
      - Waivers: waivers.md
  - CI and automation:
      - GitHub Action: github-action.md
      - GitLab CI: gitlab-ci.md
      - Report formats: reports.md
  - VSG compatibility:
      - Measured compatibility: compatibility.md
      - Rule status: rule-status.md
  - Reference:
      - CLI reference: cli.md
      - Rule counts: rule-counts.md
      - VSG configuration model: vsg-config.md
  - Developer documentation:
      - Architecture: architecture.md
      - VHDL frontend: vhdl-frontend.md
      - Performance: performance.md
      - Releasing: releasing.md
      - Upstream notes: upstream-notes.md
  - Roadmap: roadmap.md
